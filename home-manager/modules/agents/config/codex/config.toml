model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
personality = "pragmatic"
#sandbox_mode = "workspace-write"
approval_policy = "never"
sandbox_mode = "danger-full-access" 
 
[features]
multi_agent = true
multi_agent_v2 = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[projects."/home/pepegov"]
trust_level = "untrusted"
[projects."/home/pepegov/nix"]
trust_level = "trusted"
[projects."/home/pepegov/repositoryes/Private_GitHub/CalendarFlow"]
trust_level = "trusted"
[projects."/home/pepegov/repositoryes/Umbrella/management-center"]
trust_level = "trusted"
[projects."/home/pepegov/repositoryes/GITHUB/Template.Net.Monolith.Modular"]
trust_level = "trusted"
[projects."/home/pepegov/repositoryes/Private_GitHub/NFCPOS"]
trust_level = "trusted"
[projects."/home/pepegov/repositoryes/Private_GitHub/nixos_crypto"]
trust_level = "trusted"
[projects."/home/pepegov/repositoryes/Umbrella/ansible"]
trust_level = "trusted"

[mcp_servers.browsermcp]
command = "npx"
args = ["-y", "@browsermcp/mcp@latest"]
enabled = true
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true
[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
enabled = true
[mcp_servers.obsidian]
command = "npx"
args = ["-y", "@bitbonsai/mcpvault", "/home/pepegov/Nextcloud/PepegovDB"]
enabled = true
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
enabled = true
[mcp_servers.vikunja]
command = "npx"
args = ["-y", "@0xk3vin/vikunja-mcp"]
env_vars = ["VIKUNJA_URL", "VIKUNJA_API_TOKEN"]
enabled = true
[mcp_servers.avalonia]
url = "https://docs-mcp.avaloniaui.net/mcp"
enabled = true
[mcp_servers.rider]
url = "http://127.0.0.1:64482/stream"
enabled = true
[mcp_servers.figma]
command = "bunx"
args = ["figma-mcp-server"]
env_vars = ["FIGMA_API_KEY"]
enabled = false
[mcp_servers.dotnet]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-dotnet"]
enabled = false
[mcp_servers.arduino]
command = "npx"
args = ["-y", "arduino-mcp-server"]
enabled = false
