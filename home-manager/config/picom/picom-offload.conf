# PRIME offload compositor profile.  Avoid GLX's SGI video-sync scheduler,
# which can stall the X11 desktop when video playback starts.
backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-color = "#0D0C07";

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
