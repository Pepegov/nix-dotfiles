;----Colors-------------------------------------------------------------------
[colors]
background = #1b1d23
background-alt = #262932

foreground = #dcdfe4
foreground-alt = #9aa0a6

primary = #2f3545
secondary = #242832
alert = #c94f4f

underline = #3b82f6
underline-alt = #3b33f6
;-----------------------------------------------------------------------------

;----Composite-----------------------------------------------------------------
[settings]
screenchange-reload = true
;compositing-background = xor
;compositing-background = screen
;compositing-foreground = source
;compositing-border = over
;pseudo-transparency = false
;------------------------------------------------------------------------------
[global/wm]
margin-top = 5
margin-bottom = 5
; vim:ft=dosini

;====BaseBarParameters========================================================
[bar/base]
;----Monitor------------------------------------------------------------------
;monitor = ${env:MONITOR:HDMI-1}
;----Size---------------------------------------------------------------------
width = 99.5%
height = 32
offset-x = 0.25%
offset-y = 0.25%
radius = 12.0
fixed-center = true
;----MainColors----------------------------------------------------------------
background = ${colors.background}
foreground = ${colors.foreground}
;----Line----------------------------------------------------------------------
line-size = 2
line-color = #f00
;----Border--------------------------------------------------------------------
border-size = 2
border-color = #00000000
;----Margin\Padding------------------------------------------------------------
padding-left = 0
padding-right = 5
module-margin-left = 1
module-margin-right = 1
;----Font----------------------------------------------------------------------
font-0 = "JetBrainsMono Nerd Font:style=Regular:size=14;2"
font-2 = "Noto Sans:style=Regular:size=10;0"
font-3 = "Iosevka Nerd Font:style=Regular:size=12;2"
;----Modules-------------------------------------------------------------------
modules-left = bspwm
modules-center = xwindow
modules-right = pulseaudio backlight battery eth wlan xkeyboard date tray powermenu
;----Tray----------------------------------------------------------------------
;tray-position = right
;tray-padding = 2
;tray-background = #0063ff
;----Other---------------------------------------------------------------------
;wm-restack = bspwm
;override-redirect = true
;scroll-up = bspwm-desknext
;scroll-down = bspwm-deskprev
;----Mouse---------------------------------------------------------------------
cursor-click = pointer
cursor-scroll = ns-resize
;=============================================================================



;====AdditionalBarParameters==================================================
[bar/additional]
;----Monitor------------------------------------------------------------------
#monitor = ${env:DISPLAY_EXTERNAL}
monitor = eDP
;----Size---------------------------------------------------------------------
width = 100%
height = 30
radius = 8.0
fixed-center = false
;----MainColors----------------------------------------------------------------
background = ${colors.background}
foreground = ${colors.foreground}
;----Line----------------------------------------------------------------------
line-size = 2
line-color = #f00
;----Border--------------------------------------------------------------------
border-size = 4
border-color = #00000000
;----Margin\Padding------------------------------------------------------------
padding-left = 5
padding-right = 5
module-margin-left = 1
module-margin-right = 2
;----Font----------------------------------------------------------------------
font-0 = fixed:pixelsize=15;1
font-1 = unifont:fontformat=truetype:size=15:antialias=false;0	
font-2 = siji:pixelsize=15;1
;----Modules-------------------------------------------------------------------
modules-left = bspwm
modules-center = info-kernel
modules-right = filesystem memory cpu tray
;----Tray----------------------------------------------------------------------
;tray-position = right
;tray-padding = 2
;----Mouse---------------------------------------------------------------------
cursor-click = pointer
cursor-scroll = ns-resize



;====MODULES==================================================================

;----Power--------------------------------------------------------------------
[module/powermenu]
type = custom/script
exec = echo "⏻"
click-left = ~/.config/polybar/scripts/powermenu.sh
interval = 10
;-----------------------------------------------------------------------------

;----Title--------------------------------------------------------------------
[module/xwindow]
type = internal/xwindow
;ФОРМАТ ЗАГОЛОВКА
label = %title:0:50:...%
;-----------------------------------------------------------------------------

;----Kernel-------------------------------------------------------------------
[module/info-kernel]
type = custom/script
exec = uname -r
interval = 1024
;-----------------------------------------------------------------------------

;----Keyboard-----------------------------------------------------------------
[module/xkeyboard]
type = internal/xkeyboard
;БЛОКИРОВКА ОТОБРАЖЕНИЯ ОПОВЕЩЕНИЯ ВКЛЮЧЕНИЯ NUM LOCK,
;ОСТАЛЬНЫЕ ОПОВЕЩЕНИЯ МОЖНО БЛОКИРОВАТЬ ЧЕРЕЗ BLACKLIST-N
blacklist-0 = num lock
;ФОРМАТ ОТОБРАЖЕНИЯ
format = %{T0}%{T-} <label-layout>
label-layout = %layout%
format-underline = ${colors.underline}
;-----------------------------------------------------------------------------

;----FileSystem---------------------------------------------------------------
[module/filesystem]
type = internal/fs
;ИНТЕРВАЛ ОБНОВЛЕНИЯ
interval = 25
;ДИСК КОТОРЫЙ БУДЕТ ОТОБРАЖАТСЯ
mount-0 = / 
;ФОРМАТ ОТОБРАЖЕНИЯ ЦВЕТ, ТОЧКА МОНТИРОВАНИЯ, ПРОЦЕНТЫ
label-mounted = %mountpoint%%{F-}: %percentage_used%%
;ОТОБРАЖЕНИЕ НЕ ПРИМОНТИРОВАННОГО ДИСКА
label-unmounted = %mountpoint% not mounted
;ЦВЕТ ОТОБРАЖЕНИЯ НЕ ПРИМОНТИРОВАННОГО ДИСКА
label-unmounted-foreground = ${colors.foreground-alt}
;-----------------------------------------------------------------------------

;----BSPWM--------------------------------------------------------------------
[module/bspwm]
type = internal/bspwm
label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-padding = 1
label-focused-underline = ${colors.underline-alt}
label-occupied = %index%
label-occupied-padding = 1
label-urgent = %index%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %index%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 1
; Separator in between workspaces
; label-separator = |
;----------------------------------------------------------------------------

;----CPU----------------------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 5
format-prefix = "cpu:"
format-prefix-foreground = ${colors.foreground-alt}
format-underline = ${colors.underline}
label = %percentage:2%%
;-----------------------------------------------------------------------------

;----Memory-------------------------------------------------------------------
[module/memory]
type = internal/memory
interval = 5
format-prefix = "mem:"
format-prefix-foreground = ${colors.foreground-alt}
format-underline = ${colors.underline}
label = %percentage_used%%
;-----------------------------------------------------------------------------

;----WLAN---------------------------------------------------------------------
[module/wlan]
type = internal/network
interface = wlp4s0
interval = 5

format-connected = <ramp-signal> <label-connected>
;format-connected-underline = ${colors.underline}

;label-connected = %essid%  %{F#9aa0a6}%signal%%%{F-}
label-connected = %essid% 

format-disconnected = 
;format-disconnected = %{T0}󰤭%{T-}  offline
format-disconnected-foreground = ${colors.foreground-alt}
;format-disconnected-underline = ${colors.secondary}

; ---- Signal strength icons (Nerd Font) ----
ramp-signal-0 = %{T0}󰤯%{T-}
ramp-signal-1 = %{T0}󰤟%{T-}
ramp-signal-2 = %{T0}󰤢%{T-}
ramp-signal-3 = %{T0}󰤥%{T-}
ramp-signal-4 = %{T0}󰤨%{T-}

ramp-signal-foreground = ${colors.foreground}
;-----------------------------------------------------------------------------

;----LAN----------------------------------------------------------------------
[module/eth]
type = internal/network
interface = enp3s0
interval = 5

format-connected = %{T0}%{T-} <label-connected>
label-connected = %local_ip%

format-disconnected = 
;format-underline = ${colors.underline}
;-----------------------------------------------------------------------------

;----Date/Time----------------------------------------------------------------
[module/date]
type = internal/date
interval = 1
time = %H:%M
time-alt = "%H:%M"
date =
date-alt = " %d-%m-%Y"

format = %{T0}%{T-} <label>
label = %time%%date%

format-underline = ${colors.underline}
;-----------------------------------------------------------------------------

;----Audio--------------------------------------------------------------------
[module/pulseaudio]
type = custom/script
interval = 0.8

exec = "~/.config/polybar/scripts/audio.sh"  

scroll-up = pamixer -i 5
scroll-down = pamixer -d 5
click-left = pamixer -t
click-middle = pavucontrol
click-right = pactl set-source-mute @DEFAULT_SOURCE@ toggle

format-underline = ${colors.underline}
;------------------------------------------------------------------------------

;----Tray Module (New Approach)------------------------------------------------
[module/tray]
type = internal/tray
icon-size = 16
tray-padding = 2
;------------------------------------------------------------------------------

;----KdeConnect--------------------------------------------------------------------
[module/kdeconnect]  
type = custom/script  
exec = "~/.config/polybar/scripts/kdeconnect.sh -d"  
tail = true
click-right = kdeconnect-app
click-middle = kdeconnect-sms
;------------------------------------------------------------------------------

;----Backlight-----------------------------------------------------------------
[module/backlight]
type = custom/script
interval = 1

exec = bash -c "b=\$(brightnessctl g); m=\$(brightnessctl m); p=\\$((b*100/m)); if [ \\$p -lt 30 ]; then i='󰃞'; elif [ \\$p -lt 70 ]; then i='󰃟'; else i='󰃠'; fi; echo \"%{T0}\\$i%{T-} %{T1}\\$p%%{T-}\""

scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

format-underline = ${colors.underline}
;------------------------------------------------------------------------------
[module/battery]
type = internal/battery

battery = BAT1
adapter = ACAD

poll-interval = 3
full-at = 98
low-at = 15

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = %{T0} 100%%{T-}
format-low = <animation-low> <label-low>

label-charging = %{T1}%percentage%%%{T-}
label-discharging = %{T1}%percentage%%%{T-}
label-low = %{T1}%percentage%%%{T-}

format-underline = ${colors.underline}

; --- Discharging icons ---
ramp-capacity-0 = %{T0}%{T-}
ramp-capacity-1 = %{T0}%{T-}
ramp-capacity-2 = %{T0}%{T-}
ramp-capacity-3 = %{T0}%{T-}
ramp-capacity-4 = %{T0}%{T-}

; --- Charging animation ---
animation-charging-0 = %{T0}󰂆%{T-}
animation-charging-1 = %{T0}󰂇%{T-}
animation-charging-2 = %{T0}󰂈%{T-}
animation-charging-3 = %{T0}󰂉%{T-}
animation-charging-4 = %{T0}󰂊%{T-}
animation-charging-framerate = 500

; --- Low battery blinking ---
animation-low-0 = %{F#e06c75}%{F-}
animation-low-1 =
animation-low-framerate = 400
